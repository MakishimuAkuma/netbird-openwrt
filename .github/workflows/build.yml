name: Build NetBird

on:
  schedule:
    # Check for a new stable NetBird release every 6 hours.
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

env:
  OPENWRT_VERSION: 25.12.5
  FEED_BRANCH: gh-pages
  FEED_ROOT: 25.12

jobs:
  check:
    name: Check NetBird release
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.check.outputs.build }}
      version: ${{ steps.check.outputs.version }}
      tag: ${{ steps.check.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Check latest stable NetBird release
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          RELEASE_JSON="$(curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/netbirdio/netbird/releases/latest)"

          UPSTREAM_TAG="$(jq -r '.tag_name' <<< "$RELEASE_JSON")"
          UPSTREAM_VERSION="${UPSTREAM_TAG#v}"

          if [ -z "$UPSTREAM_TAG" ] || [ "$UPSTREAM_TAG" = "null" ]; then
            echo "ERROR: Could not determine latest NetBird release"
            exit 1
          fi

          echo "Latest stable NetBird release: $UPSTREAM_TAG"

          CURRENT_TAG="$(gh release list \
            --repo "${GITHUB_REPOSITORY}" \
            --exclude-drafts \
            --exclude-pre-releases \
            --limit 1 \
            --json tagName \
            --jq '.[0].tagName // ""')"

          if [ -z "$CURRENT_TAG" ]; then
            BUILD=true
            echo "No previous stable package release found."
          else
            CURRENT_VERSION="${CURRENT_TAG#v}"
            echo "Latest package release: $CURRENT_TAG"

            if [ "$(printf '%s\n%s\n' "$CURRENT_VERSION" "$UPSTREAM_VERSION" | sort -V | tail -n1)" = "$UPSTREAM_VERSION" ] \
              && [ "$CURRENT_VERSION" != "$UPSTREAM_VERSION" ]; then
              BUILD=true
            else
              BUILD=false
            fi
          fi

          # Do not automatically downgrade a newer manually maintained package.
          MAKEFILE_VERSION="$(sed -n 's/^PKG_VERSION:=//p' netbird/Makefile | head -n1 || true)"
          if [ -n "$MAKEFILE_VERSION" ] && \
             [ "$(printf '%s\n%s\n' "$UPSTREAM_VERSION" "$MAKEFILE_VERSION" | sort -V | tail -n1)" = "$MAKEFILE_VERSION" ] && \
             [ "$MAKEFILE_VERSION" != "$UPSTREAM_VERSION" ]; then
            echo "WARNING: Makefile version $MAKEFILE_VERSION is newer than upstream $UPSTREAM_VERSION."
            BUILD=false
          fi

          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "version=$UPSTREAM_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$UPSTREAM_TAG" >> "$GITHUB_OUTPUT"

  discover:
    name: Discover OpenWrt 25.12 architectures
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.arch.outputs.matrix }}
      count: ${{ steps.arch.outputs.count }}

    steps:
      - name: Discover supported package architectures
        id: arch
        shell: bash
        run: |
          set -euo pipefail

          # OpenWrt's Go package infrastructure exposes GO_ARCH_DEPENDS.
          # This is the Go/NetBird-compatible package-architecture set used by
          # current OpenWrt package CI for 25.12. Architectures known not to
          # have a usable 25.12 SDK are excluded below.
          CANDIDATES=(
            arm_cortex-a5_vfpv4
            arm_cortex-a7_neon-vfpv4
            arm_cortex-a8_vfpv3
            arm_cortex-a9
            arm_cortex-a9_vfpv3-d16
            arm_cortex-a9_neon
            arm_cortex-a15_neon-vfpv4
            aarch64_cortex-a53
            aarch64_cortex-a72
            aarch64_cortex-a76
            aarch64_generic
            mips_24kc
            mips_mips32
            mipsel_24kc
            mipsel_24kc_24kf
            mipsel_74kc
            mipsel_mips32
            mips64_octeonplus
            riscv64_generic
            loongarch64_generic
            i386_pentium4
            x86_64
          )

          # Keep only package architectures actually published by this
          # OpenWrt release. This prevents a stale SDK/package architecture
          # from entering the matrix.
          INDEX="$(curl -fsSL https://downloads.openwrt.org/releases/${OPENWRT_VERSION}/packages/)"

          SUPPORTED=()
          for ARCH in "${CANDIDATES[@]}"; do
            if grep -qE "href=[\"']${ARCH}/[\"']" <<< "$INDEX"; then
              SUPPORTED+=("$ARCH")
            else
              echo "Skipping unavailable OpenWrt package architecture: $ARCH"
            fi
          done

          if [ "${#SUPPORTED[@]}" -eq 0 ]; then
            echo "ERROR: No supported OpenWrt architectures discovered"
            exit 1
          fi

          MATRIX="$(printf '%s\n' "${SUPPORTED[@]}" | jq -R -s -c 'split("\n") | map(select(length > 0)) | {arch: .}')"
          COUNT="${#SUPPORTED[@]}"

          echo "Architectures ($COUNT):"
          printf ' - %s\n' "${SUPPORTED[@]}"

          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.arch }}
    needs:
      - check
      - discover
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Update package to NetBird ${{ needs.check.outputs.version }}
        shell: bash
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          set -euo pipefail

          sed -i -E "s/^PKG_VERSION:=.*/PKG_VERSION:=${VERSION}/" netbird/Makefile
          sed -i -E 's#^PKG_SOURCE_URL:=.*#PKG_SOURCE_URL:=https://codeload.github.com/netbirdio/netbird/tar.gz/v$(PKG_VERSION)?#' netbird/Makefile

      - name: Calculate source hash
        shell: bash
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          set -euo pipefail

          TMP="$(mktemp)"
          curl -fL --retry 5 --retry-delay 2 \
            "https://codeload.github.com/netbirdio/netbird/tar.gz/v${VERSION}" \
            -o "$TMP"

          HASH="$(sha256sum "$TMP" | awk '{print $1}')"
          rm -f "$TMP"

          sed -i -E "s/^PKG_HASH:=.*/PKG_HASH:=${HASH}/" netbird/Makefile
          echo "PKG_HASH=${HASH}"

      - name: Verify package
        shell: bash
        run: |
          set -euo pipefail
          test -f netbird/Makefile
          test -f netbird/files/netbird.init
          grep '^PKG_NAME:=' netbird/Makefile
          grep '^PKG_VERSION:=' netbird/Makefile
          grep '^PKG_RELEASE:=' netbird/Makefile
          grep '^PKG_HASH:=' netbird/Makefile

      - name: Build NetBird and signed packages.adb
        uses: openwrt/gh-action-sdk@main
        env:
          ARCH: ${{ matrix.arch }}-${{ env.OPENWRT_VERSION }}
          FEEDNAME: action
          PACKAGES: netbird
          INDEX: 1
          PRIVATE_KEY: ${{ secrets.APK_SIGNING_KEY }}
          NO_REFRESH_CHECK: 1
          NO_SHFMT_CHECK: 1
          BUILD_LOG: 1
          V: s

      - name: Collect package and signed index
        id: collect
        shell: bash
        env:
          VERSION: ${{ needs.check.outputs.version }}
          APK_SIGNING_KEY: ${{ secrets.APK_SIGNING_KEY }}
        run: |
          set -euo pipefail

          PACKAGE="$(find "bin/packages/${{ matrix.arch }}/action" \
            -maxdepth 1 -type f -name 'netbird-*.apk' -print -quit)"

          if [ -z "$PACKAGE" ]; then
            echo "ERROR: NetBird package not found for ${{ matrix.arch }}"
            find bin/packages -type f \( -name '*.apk' -o -name '*.ipk' \) -print | sort || true
            exit 1
          fi

          INDEX="bin/packages/${{ matrix.arch }}/action/packages.adb"
          if [ ! -s "$INDEX" ]; then
            echo "ERROR: packages.adb not found for ${{ matrix.arch }}"
            exit 1
          fi

          mkdir -p release "feed/${{ matrix.arch }}"

          cp "$PACKAGE" "release/netbird-${VERSION}-${{ matrix.arch }}.apk"
          cp "$PACKAGE" "feed/${{ matrix.arch }}/"
          cp "$INDEX" "feed/${{ matrix.arch }}/packages.adb"

          # The OpenWrt SDK signs packages.adb with the supplied private key.
          # Publish only the public key.
          printf '%s' "$APK_SIGNING_KEY" > /tmp/netbird-feed.pem
          chmod 600 /tmp/netbird-feed.pem
          openssl ec -in /tmp/netbird-feed.pem -pubout -out "feed/${{ matrix.arch }}/netbird-feed.pub.pem"
          rm -f /tmp/netbird-feed.pem

          echo "release=release/netbird-${VERSION}-${{ matrix.arch }}.apk" >> "$GITHUB_OUTPUT"

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: netbird-feed-${{ matrix.arch }}
          path: |
            release/*.apk
            feed/${{ matrix.arch }}/*
          if-no-files-found: error
          retention-days: 7

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: netbird-build-log-${{ matrix.arch }}
          path: logs/
          if-no-files-found: ignore
          retention-days: 7

  release:
    name: Create Release and publish APK feed
    needs:
      - check
      - discover
      - build
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: netbird-feed-*
          path: artifacts
          merge-multiple: true

      - name: Verify all architectures
        shell: bash
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          set -euo pipefail

          EXPECTED="${{ needs.discover.outputs.count }}"
          FOUND="$(find artifacts/release -maxdepth 1 -type f -name '*.apk' | wc -l)"

          echo "Expected: $EXPECTED"
          echo "Found:    $FOUND"

          [ "$FOUND" -eq "$EXPECTED" ] || {
            echo "ERROR: Not all architecture builds produced an APK"
            find artifacts -type f -print | sort
            exit 1
          }

          FIRST_ARCH="$(jq -r '.arch[0]' <<< '${{ needs.discover.outputs.matrix }}')"
          test -s "artifacts/feed/${FIRST_ARCH}/netbird-feed.pub.pem"

          while read -r ARCH; do
            test -s "artifacts/feed/${ARCH}/packages.adb"
            test -f "artifacts/feed/${ARCH}/netbird-feed.pub.pem"
            test "$(find "artifacts/feed/${ARCH}" -maxdepth 1 -type f -name 'netbird-*.apk' | wc -l)" -eq 1
          done < <(jq -r '.arch[]' <<< '${{ needs.discover.outputs.matrix }}')

          echo "All discovered architecture builds completed and have signed packages.adb."

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.check.outputs.tag }}
          name: NetBird ${{ needs.check.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            artifacts/release/*.apk
            artifacts/feed/aarch64_cortex-a53/netbird-feed.pub.pem
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Publish APK feed to gh-pages
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          set -euo pipefail

          REPO_URL="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          if git ls-remote --exit-code --heads "$REPO_URL" "$FEED_BRANCH" >/dev/null 2>&1; then
            git clone --depth 1 --branch "$FEED_BRANCH" "$REPO_URL" feed-repo
          else
            mkdir feed-repo
            cd feed-repo
            git init
            git checkout --orphan "$FEED_BRANCH"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            touch .nojekyll
            git add .nojekyll
            git commit -m "Initialize NetBird APK feed"
            git remote add origin "$REPO_URL"
            git push -u origin "$FEED_BRANCH"
          fi

          cd "$GITHUB_WORKSPACE/feed-repo"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          mkdir -p "${FEED_ROOT}"

          jq -r '.arch[]' <<< '${{ needs.discover.outputs.matrix }}' | while read -r ARCH; do
            rm -rf "${FEED_ROOT}/${ARCH}"
            mkdir -p "${FEED_ROOT}/${ARCH}"

            # Each architecture gets the real OpenWrt package name plus the
            # signed packages.adb generated by the SDK.
            cp "${GITHUB_WORKSPACE}/artifacts/feed/${ARCH}/"*.apk \
              "${FEED_ROOT}/${ARCH}/"
            cp "${GITHUB_WORKSPACE}/artifacts/feed/${ARCH}/packages.adb" \
              "${FEED_ROOT}/${ARCH}/packages.adb"
          done

          cp "${GITHUB_WORKSPACE}/artifacts/feed/$(jq -r '.arch[0]' <<< '${{ needs.discover.outputs.matrix }}')/netbird-feed.pub.pem" \
            netbird-feed.pub.pem

          cat > README.md <<EOF
          # NetBird OpenWrt APK feed

          OpenWrt: ${OPENWRT_VERSION}
          NetBird: ${VERSION}

          Add the public key:
          https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${FEED_BRANCH}/netbird-feed.pub.pem

          Repository URL:
          https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${FEED_BRANCH}/${FEED_ROOT}/<ARCH>/packages.adb
          EOF

          git add .
          git commit -m "NetBird ${VERSION}" || true
          git push origin "$FEED_BRANCH"

      - name: Write OpenWrt repository instructions
        shell: bash
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          set -euo pipefail

          BASE="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${FEED_BRANCH}/${FEED_ROOT}"
          KEY="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${FEED_BRANCH}/netbird-feed.pub.pem"

          {
            echo "## NetBird OpenWrt APK feed"
            echo
            echo "NetBird ${VERSION}"
            echo
            echo "### Install trust key once"
            echo
            echo '```sh'
            echo "wget -qO /etc/apk/keys/netbird-feed.pem ${KEY}"
            echo '```'
            echo
            echo "### Add repository"
            echo
            echo '```sh'
            echo "echo '${BASE}/<ARCH>/packages.adb' > /etc/apk/repositories.d/netbird.list"
            echo 'apk update'
            echo 'apk add netbird'
            echo '```'
            echo
            echo "### Update NetBird"
            echo
            echo '```sh'
            echo 'apk update'
            echo 'apk upgrade netbird'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

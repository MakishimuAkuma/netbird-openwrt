name: Build NetBird

on:
  schedule:
    # Check for a new stable NetBird release every 6 hours.
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

env:
  OPENWRT_VERSION: 25.12.5

jobs:
  check:
    name: Check NetBird release
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.check.outputs.build }}
      version: ${{ steps.check.outputs.version }}
      tag: ${{ steps.check.outputs.tag }}

    steps:
      - name: Check latest stable NetBird release
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          API="https://api.github.com/repos/netbirdio/netbird/releases/latest"

          RELEASE_JSON="$(curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$API")"

          UPSTREAM_TAG="$(jq -r '.tag_name' <<< "$RELEASE_JSON")"
          UPSTREAM_VERSION="${UPSTREAM_TAG#v}"

          if [ -z "$UPSTREAM_TAG" ] || [ "$UPSTREAM_TAG" = "null" ]; then
            echo "ERROR: Could not determine latest NetBird release"
            exit 1
          fi

          echo "Latest stable NetBird release: $UPSTREAM_TAG"

          # Find the newest release already published by this repository.
          CURRENT_TAG="$(gh release list \
            --repo "${GITHUB_REPOSITORY}" \
            --exclude-drafts \
            --exclude-pre-releases \
            --limit 1 \
            --json tagName \
            --jq '.[0].tagName // ""')"

          if [ -z "$CURRENT_TAG" ]; then
            echo "No previous stable package release found."
            echo "A build is required."
            BUILD=true
          else
            CURRENT_VERSION="${CURRENT_TAG#v}"

            echo "Latest package release: $CURRENT_TAG"

            if [ "$(printf '%s\n%s\n' "$CURRENT_VERSION" "$UPSTREAM_VERSION" | sort -V | tail -n1)" = "$UPSTREAM_VERSION" ] \
              && [ "$CURRENT_VERSION" != "$UPSTREAM_VERSION" ]; then
              BUILD=true
            else
              BUILD=false
            fi
          fi

          # Never downgrade the package if the repository already contains
          # a newer manually-built NetBird version than upstream latest.
          if [ -f netbird/Makefile ]; then
            MAKEFILE_VERSION="$(sed -n 's/^PKG_VERSION:=//p' netbird/Makefile | head -n1 || true)"

            if [ -n "$MAKEFILE_VERSION" ] && \
               [ "$(printf '%s\n%s\n' "$UPSTREAM_VERSION" "$MAKEFILE_VERSION" | sort -V | tail -n1)" = "$MAKEFILE_VERSION" ] && \
               [ "$MAKEFILE_VERSION" != "$UPSTREAM_VERSION" ]; then
              echo "WARNING: Makefile version $MAKEFILE_VERSION is newer than upstream $UPSTREAM_VERSION."
              echo "No automatic downgrade will be performed."
              BUILD=false
            fi
          fi

          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "version=$UPSTREAM_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$UPSTREAM_TAG" >> "$GITHUB_OUTPUT"

          if [ "$BUILD" = true ]; then
            echo "New NetBird stable release detected: $UPSTREAM_TAG"
          else
            echo "No newer stable NetBird release to build."
          fi

  build:
    name: Build ${{ matrix.arch }}
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        arch:
          - arm_cortex-a7
          - arm_cortex-a9
          - arm_cortex-a15_neon-vfpv4

          - aarch64_cortex-a53
          - aarch64_cortex-a72
          - rockchip-armv8
          - aarch64_generic

          - i386_pentium4
          - x86_64

          - mipsel_24kc
          - mips_mips32
          - mips64_octeonplus

          - riscv64_generic

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Update package to NetBird ${{ needs.check.outputs.version }}
        shell: bash
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          set -euo pipefail

          sed -i \
            -E "s/^PKG_VERSION:=.*/PKG_VERSION:=${VERSION}/" \
            netbird/Makefile

          sed -i \
            -E "s#^PKG_SOURCE_URL:=.*#PKG_SOURCE_URL:=https://codeload.github.com/netbirdio/netbird/tar.gz/v\$(PKG_VERSION)\\?#" \
            netbird/Makefile

          echo "Updated Makefile:"
          grep -E '^PKG_(NAME|VERSION|RELEASE|SOURCE|SOURCE_URL|HASH):=' netbird/Makefile

      - name: Calculate source hash
        shell: bash
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          set -euo pipefail

          URL="https://codeload.github.com/netbirdio/netbird/tar.gz/v${VERSION}"
          TMP="$(mktemp)"

          curl -fL --retry 5 --retry-delay 2 "$URL" -o "$TMP"

          HASH="$(sha256sum "$TMP" | awk '{print $1}')"

          rm -f "$TMP"

          sed -i \
            -E "s/^PKG_HASH:=.*/PKG_HASH:=${HASH}/" \
            netbird/Makefile

          echo "PKG_HASH=${HASH}"

      - name: Verify package
        shell: bash
        run: |
          set -euo pipefail

          test -f netbird/Makefile
          test -f netbird/files/netbird.init

          echo "Package:"
          grep '^PKG_NAME:=' netbird/Makefile

          echo "Version:"
          grep '^PKG_VERSION:=' netbird/Makefile

          echo "Release:"
          grep '^PKG_RELEASE:=' netbird/Makefile

          echo "Source hash:"
          grep '^PKG_HASH:=' netbird/Makefile

      - name: Build NetBird
        uses: openwrt/gh-action-sdk@main
        env:
          ARCH: ${{ matrix.arch }}-${{ env.OPENWRT_VERSION }}
          FEEDNAME: action
          PACKAGES: netbird
          NO_REFRESH_CHECK: 1
          NO_SHFMT_CHECK: 1
          BUILD_LOG: 1
          V: s

      - name: Find package
        id: package
        shell: bash
        run: |
          set -euo pipefail

          PACKAGE="$(find bin/packages \
            -type f \
            -name 'netbird-*.apk' \
            -print \
            | head -n 1)"

          if [ -z "$PACKAGE" ]; then
            echo "ERROR: NetBird package not found"
            echo
            find bin/packages \
              -type f \
              \( -name '*.apk' -o -name '*.ipk' \) \
              -print \
              | sort || true
            exit 1
          fi

          echo "Found: $PACKAGE"
          echo "path=$PACKAGE" >> "$GITHUB_OUTPUT"

      - name: Prepare package
        shell: bash
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          set -euo pipefail

          mkdir -p release

          cp "${{ steps.package.outputs.path }}" \
            "release/netbird-${VERSION}-${{ matrix.arch }}.apk"

          ls -lh release/

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: netbird-package-${{ matrix.arch }}
          path: release/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: netbird-build-log-${{ matrix.arch }}
          path: logs/
          if-no-files-found: ignore
          retention-days: 7

  release:
    name: Create GitHub Release
    needs:
      - check
      - build
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Download package artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: netbird-package-*
          path: release
          merge-multiple: true

      - name: Verify packages
        shell: bash
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          set -euo pipefail

          echo "Packages:"
          find release \
            -type f \
            -name '*.apk' \
            -print \
            | sort

          COUNT="$(find release \
            -type f \
            -name '*.apk' \
            | wc -l)"

          echo
          echo "Found $COUNT APK(s)"

          if [ "$COUNT" -ne 13 ]; then
            echo "ERROR: Expected 13 APKs"
            exit 1
          fi

      - name: Verify architectures
        shell: bash
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          set -euo pipefail

          for ARCH in \
            arm_cortex-a7 \
            arm_cortex-a9 \
            arm_cortex-a15_neon-vfpv4 \
            aarch64_cortex-a53 \
            aarch64_cortex-a72 \
            rockchip-armv8 \
            aarch64_generic \
            i386_pentium4 \
            x86_64 \
            mipsel_24kc \
            mips_mips32 \
            mips64_octeonplus \
            riscv64_generic
          do
            FILE="release/netbird-${VERSION}-${ARCH}.apk"

            if [ ! -f "$FILE" ]; then
              echo "ERROR: Missing package for $ARCH"
              exit 1
            fi
          done

          echo "All 13 architectures are present."

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.check.outputs.tag }}
          name: NetBird ${{ needs.check.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            release/*.apk
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

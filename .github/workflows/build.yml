name: Build NetBird

on:
  schedule:
    # Check for a new stable NetBird release every 6 hours.
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

env:
  OPENWRT_VERSION: 25.12.5
  FEED_BRANCH: gh-pages
  FEED_ROOT: 25.12

jobs:
  check:
    name: Check NetBird release
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.check.outputs.build }}
      version: ${{ steps.check.outputs.version }}
      tag: ${{ steps.check.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Check latest stable NetBird release
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          API="https://api.github.com/repos/netbirdio/netbird/releases/latest"

          RELEASE_JSON="$(curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$API")"

          UPSTREAM_TAG="$(jq -r '.tag_name' <<< "$RELEASE_JSON")"
          UPSTREAM_VERSION="${UPSTREAM_TAG#v}"

          if [ -z "$UPSTREAM_TAG" ] || [ "$UPSTREAM_TAG" = "null" ]; then
            echo "ERROR: Could not determine latest NetBird release"
            exit 1
          fi

          echo "Latest stable NetBird release: $UPSTREAM_TAG"

          CURRENT_TAG="$(gh release list \
            --repo "${GITHUB_REPOSITORY}" \
            --exclude-drafts \
            --exclude-pre-releases \
            --limit 1 \
            --json tagName \
            --jq '.[0].tagName // ""')"

          if [ -z "$CURRENT_TAG" ]; then
            echo "No previous stable package release found."
            BUILD=true
          else
            CURRENT_VERSION="${CURRENT_TAG#v}"
            echo "Latest package release: $CURRENT_TAG"

            if [ "$(printf '%s\n%s\n' "$CURRENT_VERSION" "$UPSTREAM_VERSION" | sort -V | tail -n1)" = "$UPSTREAM_VERSION" ] \
              && [ "$CURRENT_VERSION" != "$UPSTREAM_VERSION" ]; then
              BUILD=true
            else
              BUILD=false
            fi
          fi

          # Never automatically downgrade a package version already present
          # in the source tree.
          if [ -f netbird/Makefile ]; then
            MAKEFILE_VERSION="$(sed -n 's/^PKG_VERSION:=//p' netbird/Makefile | head -n1 || true)"

            if [ -n "$MAKEFILE_VERSION" ] && \
               [ "$(printf '%s\n%s\n' "$UPSTREAM_VERSION" "$MAKEFILE_VERSION" | sort -V | tail -n1)" = "$MAKEFILE_VERSION" ] && \
               [ "$MAKEFILE_VERSION" != "$UPSTREAM_VERSION" ]; then
              echo "WARNING: Makefile version $MAKEFILE_VERSION is newer than upstream $UPSTREAM_VERSION."
              echo "No automatic downgrade will be performed."
              BUILD=false
            fi
          fi

          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "version=$UPSTREAM_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$UPSTREAM_TAG" >> "$GITHUB_OUTPUT"

          if [ "$BUILD" = true ]; then
            echo "New NetBird stable release detected: $UPSTREAM_TAG"
          else
            echo "No newer stable NetBird release to build."
          fi

  build:
    name: Build ${{ matrix.arch }}
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        arch:
          - arm_cortex-a7
          - arm_cortex-a9
          - arm_cortex-a15_neon-vfpv4

          - aarch64_cortex-a53
          - aarch64_cortex-a72
          - rockchip-armv8
          - aarch64_generic

          - i386_pentium4
          - x86_64

          - mipsel_24kc
          - mips_mips32
          - mips64_octeonplus

          - riscv64_generic

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Update package to NetBird ${{ needs.check.outputs.version }}
        shell: bash
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          set -euo pipefail

          sed -i \
            -E "s/^PKG_VERSION:=.*/PKG_VERSION:=${VERSION}/" \
            netbird/Makefile

          sed -i \
            -E "s#^PKG_SOURCE_URL:=.*#PKG_SOURCE_URL:=https://codeload.github.com/netbirdio/netbird/tar.gz/v\$(PKG_VERSION)\\?#" \
            netbird/Makefile

      - name: Calculate source hash
        shell: bash
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          set -euo pipefail

          URL="https://codeload.github.com/netbirdio/netbird/tar.gz/v${VERSION}"
          TMP="$(mktemp)"

          curl -fL --retry 5 --retry-delay 2 "$URL" -o "$TMP"
          HASH="$(sha256sum "$TMP" | awk '{print $1}')"
          rm -f "$TMP"

          sed -i \
            -E "s/^PKG_HASH:=.*/PKG_HASH:=${HASH}/" \
            netbird/Makefile

          echo "PKG_HASH=${HASH}"

      - name: Verify package
        shell: bash
        run: |
          set -euo pipefail

          test -f netbird/Makefile
          test -f netbird/files/netbird.init

          grep '^PKG_NAME:=' netbird/Makefile
          grep '^PKG_VERSION:=' netbird/Makefile
          grep '^PKG_RELEASE:=' netbird/Makefile
          grep '^PKG_HASH:=' netbird/Makefile

      - name: Build NetBird
        uses: openwrt/gh-action-sdk@main
        env:
          ARCH: ${{ matrix.arch }}-${{ env.OPENWRT_VERSION }}
          FEEDNAME: action
          PACKAGES: netbird
          NO_REFRESH_CHECK: 1
          NO_SHFMT_CHECK: 1
          BUILD_LOG: 1
          V: s

      - name: Find package
        id: package
        shell: bash
        run: |
          set -euo pipefail

          PACKAGE="$(find bin/packages \
            -type f \
            -name 'netbird-*.apk' \
            -print \
            | head -n 1)"

          if [ -z "$PACKAGE" ]; then
            echo "ERROR: NetBird package not found"
            find bin/packages -type f \( -name '*.apk' -o -name '*.ipk' \) -print | sort || true
            exit 1
          fi

          echo "Found: $PACKAGE"
          echo "path=$PACKAGE" >> "$GITHUB_OUTPUT"

      - name: Prepare signed APK repository index
        shell: bash
        env:
          APK_SIGNING_KEY: ${{ secrets.APK_SIGNING_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${APK_SIGNING_KEY:-}" ]; then
            echo "ERROR: Repository secret APK_SIGNING_KEY is not configured."
            echo "Generate a P-256 key and add the private key as the APK_SIGNING_KEY secret."
            exit 1
          fi

          APK_BIN="$(find staging_dir/host/bin -maxdepth 1 -type f -name apk -print -quit)"
          if [ -z "$APK_BIN" ]; then
            echo "ERROR: OpenWrt apk host tool not found in staging_dir/host/bin"
            exit 1
          fi

          printf '%s' "$APK_SIGNING_KEY" > feed-key.pem
          chmod 600 feed-key.pem

          mkdir -p "feed/${{ matrix.arch }}"

          # Keep the original OpenWrt package filename in the feed. apk uses
          # name-version.apk when resolving a package from packages.adb.
          cp "${{ steps.package.outputs.path }}" \
            "feed/${{ matrix.arch }}/"

          openssl ec -in feed-key.pem -pubout > feed/netbird-feed.pub.pem

          (
            cd "feed/${{ matrix.arch }}"
            "$APK_BIN" mkndx \
              --allow-untrusted \
              --sign-key "$GITHUB_WORKSPACE/feed-key.pem" \
              --output packages.adb \
              ./*.apk
          )

          test -s "feed/${{ matrix.arch }}/packages.adb"
          test -s feed/netbird-feed.pub.pem

          echo "Signed feed index created for ${{ matrix.arch }}"

      - name: Prepare Release package
        shell: bash
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          set -euo pipefail

          mkdir -p release

          cp "${{ steps.package.outputs.path }}" \
            "release/netbird-${VERSION}-${{ matrix.arch }}.apk"

          rm -f feed-key.pem

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: netbird-package-${{ matrix.arch }}
          path: |
            release/*.apk
            feed/${{ matrix.arch }}/*.apk
            feed/${{ matrix.arch }}/packages.adb
            feed/netbird-feed.pub.pem
          if-no-files-found: error
          retention-days: 7

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: netbird-build-log-${{ matrix.arch }}
          path: logs/
          if-no-files-found: ignore
          retention-days: 7

  release:
    name: Create Release and publish APK feed
    needs:
      - check
      - build
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: netbird-package-*
          path: artifacts
          merge-multiple: true

      - name: Verify packages and indexes
        shell: bash
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          set -euo pipefail

          EXPECTED_ARCHES=(
            arm_cortex-a7
            arm_cortex-a9
            arm_cortex-a15_neon-vfpv4
            aarch64_cortex-a53
            aarch64_cortex-a72
            rockchip-armv8
            aarch64_generic
            i386_pentium4
            x86_64
            mipsel_24kc
            mips_mips32
            mips64_octeonplus
            riscv64_generic
          )

          COUNT="$(find artifacts/release -type f -name '*.apk' | wc -l)"
          [ "$COUNT" -eq 13 ] || {
            echo "ERROR: Expected 13 Release APKs, found $COUNT"
            exit 1
          }

          for ARCH in "${EXPECTED_ARCHES[@]}"; do
            test -f "artifacts/feed/${ARCH}/packages.adb"
            test "$(find "artifacts/feed/${ARCH}" -maxdepth 1 -name '*.apk' | wc -l)" -eq 1
            test -f "artifacts/release/netbird-${VERSION}-${ARCH}.apk"
          done

          test -s artifacts/feed/netbird-feed.pub.pem

          echo "All 13 packages and signed package indexes are present."

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.check.outputs.tag }}
          name: NetBird ${{ needs.check.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            artifacts/release/*.apk
            artifacts/feed/netbird-feed.pub.pem
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish APK feed to gh-pages
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          set -euo pipefail

          REPO_URL="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          if git ls-remote --exit-code --heads "$REPO_URL" "$FEED_BRANCH" >/dev/null 2>&1; then
            git clone --depth 1 --branch "$FEED_BRANCH" "$REPO_URL" feed-repo
          else
            mkdir feed-repo
            cd feed-repo
            git init
            git checkout --orphan "$FEED_BRANCH"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            touch .nojekyll
            git add .nojekyll
            git commit -m "Initialize APK feed"
            git remote add origin "$REPO_URL"
          fi

          cd "$GITHUB_WORKSPACE/feed-repo"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          mkdir -p "${FEED_ROOT}"

          for ARCH in \
            arm_cortex-a7 \
            arm_cortex-a9 \
            arm_cortex-a15_neon-vfpv4 \
            aarch64_cortex-a53 \
            aarch64_cortex-a72 \
            rockchip-armv8 \
            aarch64_generic \
            i386_pentium4 \
            x86_64 \
            mipsel_24kc \
            mips_mips32 \
            mips64_octeonplus \
            riscv64_generic
          do
            rm -rf "${FEED_ROOT}/${ARCH}"
            mkdir -p "${FEED_ROOT}/${ARCH}"

            # The feed must contain the package with its real OpenWrt name.
            cp "${GITHUB_WORKSPACE}/artifacts/feed/${ARCH}/"*.apk \
              "${FEED_ROOT}/${ARCH}/"
            cp "${GITHUB_WORKSPACE}/artifacts/feed/${ARCH}/packages.adb" \
              "${FEED_ROOT}/${ARCH}/packages.adb"
          done

          cp "${GITHUB_WORKSPACE}/artifacts/feed/netbird-feed.pub.pem" \
            netbird-feed.pub.pem

          cat > README.md <<EOF
          # NetBird OpenWrt APK feed

          OpenWrt version: ${OPENWRT_VERSION}
          NetBird version: ${VERSION}

          Repository index URLs:

          EOF

          for ARCH in \
            arm_cortex-a7 \
            arm_cortex-a9 \
            arm_cortex-a15_neon-vfpv4 \
            aarch64_cortex-a53 \
            aarch64_cortex-a72 \
            rockchip-armv8 \
            aarch64_generic \
            i386_pentium4 \
            x86_64 \
            mipsel_24kc \
            mips_mips32 \
            mips64_octeonplus \
            riscv64_generic
          do
            echo "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${FEED_BRANCH}/${FEED_ROOT}/${ARCH}/packages.adb" >> README.md
          done

          cat >> README.md <<'EOF'

          Public signing key:

          https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${FEED_BRANCH}/netbird-feed.pub.pem
          EOF

          git add .

          if git diff --cached --quiet; then
            echo "Feed is already up to date."
          else
            git commit -m "NetBird ${VERSION}"
            git push origin "$FEED_BRANCH"
          fi

      - name: Write OpenWrt repository instructions
        shell: bash
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          set -euo pipefail

          OWNER="${GITHUB_REPOSITORY%%/*}"
          REPO="${GITHUB_REPOSITORY#*/}"
          BASE="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${FEED_BRANCH}/${FEED_ROOT}"

          {
            echo "## NetBird OpenWrt APK feed"
            echo
            echo "NetBird ${VERSION} was built for all 13 architectures."
            echo
            echo "### One-time trust setup"
            echo
            echo '```sh'
            echo "wget -qO /etc/apk/keys/netbird-feed.pem ${BASE%/*}/netbird-feed.pub.pem"
            echo '```'
            echo
            echo "### Repository URL for this architecture"
            echo
            echo '```text'
            echo "${BASE}/<ARCH>/packages.adb"
            echo '```'
            echo
            echo "### Example for x86_64"
            echo
            echo '```sh'
            echo "wget -qO /etc/apk/keys/netbird-feed.pem ${BASE%/*}/netbird-feed.pub.pem"
            echo "echo '${BASE}/x86_64/packages.adb' > /etc/apk/repositories.d/netbird.list"
            echo 'apk update'
            echo 'apk add netbird'
            echo 'apk upgrade netbird'
            echo '```'
            echo
            echo "The feed uses a signed packages.adb index, so after the public key is installed no --allow-untrusted option is required."
          } >> "$GITHUB_STEP_SUMMARY"
